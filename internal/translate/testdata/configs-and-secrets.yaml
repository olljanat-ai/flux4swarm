# A namespaced Deployment (a Docker stack) consuming ConfigMaps and
# Secrets as env and files, plus emptyDir, hostPath and PVC volumes.
apiVersion: v1
kind: ConfigMap
metadata: {name: app-env, namespace: shop}
data: {LOG_LEVEL: debug, COLOR: blue}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: nginx, namespace: shop}
data:
  nginx.conf: "server {}\n"
  mime.types: "types {}\n"
---
apiVersion: v1
kind: Secret
metadata: {name: db, namespace: shop}
stringData:
  password: s3cret
  user: app
---
apiVersion: v1
kind: Secret
metadata: {name: tls, namespace: shop}
stringData:
  tls.crt: CERT
  tls.key: KEY
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: shop
  labels: {backup: daily}
  annotations:
    swarm.flux4swarm.io/volume-driver: rexray
    swarm.flux4swarm.io/volume-options: '{"size":"10"}'
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: example.com/shop/api:2.0
          envFrom:
            - configMapRef: {name: app-env}
            - secretRef: {name: db}
              prefix: DB_
            - configMapRef: {name: missing, optional: true}
          env:
            - name: DB_PASSWORD_AGAIN
              valueFrom: {secretKeyRef: {name: db, key: password}}
            - name: COLOR_AGAIN
              valueFrom: {configMapKeyRef: {name: app-env, key: COLOR}}
            - name: OPTIONAL
              valueFrom: {configMapKeyRef: {name: app-env, key: nope, optional: true}}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx}
            - {name: nginx-one, mountPath: /etc/conf.d/default.conf, subPath: default.conf}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: cache, mountPath: /cache}
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /var/log/host, readOnly: true}
            - {name: data, mountPath: /data, subPath: api}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: nginx
          configMap: {name: nginx}
        - name: nginx-one
          configMap:
            name: nginx
            items: [{key: nginx.conf, path: default.conf, mode: 0444}]
        - name: tls
          secret: {secretName: tls, defaultMode: 0400}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: logs
          hostPath: {path: /var/log}
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: shared
          persistentVolumeClaim: {claimName: not-in-source, readOnly: true}
