name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || (gofmt -l $(git ls-files '*.go'); exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: make build
      - name: docker image
        run: docker build -t flux4swarm:ci .

  # Build the release (binaries, archives, SBOMs, multi-arch images) without
  # signing or publishing, so a broken .goreleaser.yaml fails here rather
  # than on a tag.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish
      - name: version command
        run: |
          ./dist/flux4swarm_linux_amd64_v1/flux4swarm version
          docker run --rm "ghcr.io/olljanat-ai/flux4swarm:$(./dist/flux4swarm_linux_amd64_v1/flux4swarm version --short)-amd64" version
