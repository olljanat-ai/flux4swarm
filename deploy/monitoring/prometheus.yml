# Scrapes the flux4swarm controller of deploy/flux4swarm-stack.yaml and
# `import --watch` of deploy/flux4swarm-export-stack.yaml. The monitoring
# stack joins the flux-system_default network, where the controller's tasks
# resolve as tasks.controller, and (when you uncomment it in
# monitoring-stack.yaml) flux4swarm-export_default, where the watcher's
# resolve as tasks.export. A job whose name does not resolve has no targets.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: flux4swarm
    dns_sd_configs:
      - names: [tasks.controller]
        type: A
        port: 9797
  - job_name: flux4swarm-export
    dns_sd_configs:
      - names: [tasks.export]
        type: A
        port: 9797
