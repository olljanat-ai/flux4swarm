# Runs `flux4swarm import --watch` as a Swarm service: the Swarm stays the
# source of truth (keep using docker stack deploy / docker service) and every
# change is committed to Git, where Flux on Kubernetes picks it up.
#   docker secret create flux4swarm-export_username - <<< "git"
#   docker secret create flux4swarm-export_password - <<< "<PAT with write access>"
#   docker stack deploy -c deploy/flux4swarm-export-stack.yaml flux4swarm-export
# The export owns clusters/<cluster>/apps only; see
# docs/kubernetes-and-swarm.md for where Kubernetes-only additions go.
# --exclude keeps this stack (service and Git credentials) out of the export.
# Port 9797 serves /healthz (fails after --unhealthy-after without a
# successful export), /status and /metrics; deploy/monitoring scrapes it as
# tasks.export and alerts on failing exports.
version: "3.8"
services:
  export:
    image: ghcr.io/olljanat-ai/flux4swarm:latest
    command: ["import", "--watch", "--cluster", "prod", "--bootstrap",
      "--git-url", "https://github.com/acme/fleet", "--branch", "main",
      "--git-secret", "flux4swarm-export", "--exclude", "^flux4swarm-export_",
      "--secret-store-provider", "vault", "--log-format", "json"]
    environment:
      FLUX4SWARM_DEFAULT_NAMESPACE: default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - flux4swarm-export_username
      - flux4swarm-export_password
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
secrets:
  flux4swarm-export_username:
    external: true
  flux4swarm-export_password:
    external: true
